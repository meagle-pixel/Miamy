<svg width="100%" viewBox="0 0 680 412" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Authentification : 3 profils et la session</title>
  <desc>Après une connexion réussie, la session stocke le profil de l'utilisateur, et l'accès diffère selon le profil : administrateur, restaurateur ou client.</desc>

  <text x="340" y="28" text-anchor="middle" font-size="20" font-weight="500" fill="#1a1a18">Authentification : 3 profils + session</text>

  <rect x="190" y="46" width="300" height="56" rx="10" fill="#f5f4f0" stroke="#d8d6cd"/>
  <text x="340" y="70" text-anchor="middle" font-size="14" font-weight="500" fill="#1a1a18">Connexion réussie</text>
  <text x="340" y="90" text-anchor="middle" font-size="12" fill="#5f5e59" font-family="ui-monospace, Menlo, monospace">$_SESSION : connected · user · profil</text>

  <g stroke="#9a988f" stroke-width="1.5" fill="none">
    <line x1="340" y1="102" x2="340" y2="140"/>
    <line x1="125" y1="140" x2="555" y2="140"/>
    <line x1="125" y1="140" x2="125" y2="172"/>
    <line x1="340" y1="140" x2="340" y2="172"/>
    <line x1="555" y1="140" x2="555" y2="172"/>
  </g>
  <g fill="#9a988f">
    <path d="M125 174 l-4 -7 l8 0 z"/>
    <path d="M340 174 l-4 -7 l8 0 z"/>
    <path d="M555 174 l-4 -7 l8 0 z"/>
  </g>

  <rect x="30" y="174" width="190" height="172" rx="10" fill="#ffffff" stroke="#6b5bd0" stroke-width="2"/>
  <text x="125" y="200" text-anchor="middle" font-size="13" font-weight="500" fill="#6b5bd0">Profil 1 · Admin</text>
  <g font-size="12.5" fill="#1a1a18">
    <text x="46" y="230">Tableau de bord</text>
    <text x="46" y="256">Gérer les comptes</text>
    <text x="46" y="282">Gérer les restaurants</text>
    <text x="46" y="308">Superviser la BDD</text>
  </g>

  <rect x="245" y="174" width="190" height="172" rx="10" fill="#ffffff" stroke="#1D9E75" stroke-width="2"/>
  <text x="340" y="200" text-anchor="middle" font-size="13" font-weight="500" fill="#1D9E75">Profil 2 · Restaurateur</text>
  <g font-size="12.5" fill="#1a1a18">
    <text x="261" y="230">Son espace pro</text>
    <text x="261" y="256">Gérer sa carte (plats)</text>
    <text x="261" y="282">Horaires, drag &amp; drop</text>
    <text x="261" y="308">Ses restaurants</text>
  </g>

  <rect x="460" y="174" width="190" height="172" rx="10" fill="#ffffff" stroke="#2b76c9" stroke-width="2"/>
  <text x="555" y="200" text-anchor="middle" font-size="13" font-weight="500" fill="#2b76c9">Profil 3 · Client</text>
  <g font-size="12.5" fill="#1a1a18">
    <text x="476" y="230">Son compte</text>
    <text x="476" y="256">Voir les restaurants</text>
    <text x="476" y="282">Commander (à venir)</text>
  </g>

  <text x="340" y="384" text-anchor="middle" font-size="12.5" fill="#5f5e59">Chaque page protégée vérifie $_SESSION['user']['profil'] avant d'afficher son contenu.</text>
</svg>
